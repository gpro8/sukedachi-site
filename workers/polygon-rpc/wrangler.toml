name = "sukedachi-polygon-rpc"
main = "src/index.js"
compatibility_date = "2026-03-01"
workers_dev = true

# POLYGON_RPC_URL set via: npx wrangler secret put POLYGON_RPC_URL
# Never commit the Alchemy URL.

[vars]
# Comma-separated browser origins allowed to call this proxy
ALLOWED_ORIGINS = "https://gpro8.github.io,http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173"
