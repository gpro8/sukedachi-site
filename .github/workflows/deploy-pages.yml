name: Deploy GitHub Pages

# Build on main → publish `gh-pages` branch (stable; avoids flaky actions/deploy-pages env).
# One-time repo setting: Settings → Pages → Build and deployment
#   Source: Deploy from a branch
#   Branch: gh-pages / (root)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-branch
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_RPC_URL: ${{ secrets.VITE_RPC_URL }}

      - name: Publish dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
